openapi: 3.1.0
info:
  title: AI-Powered Agentic Placement Mentor API
  description: >
    REST APIs for externally meaningful services in the placement mentor platform.
    This encompasses user management, domains (companies, roles, topics, questions),
    assessments (submissions, evaluation, mastery), interview sessions, learning roadmaps,
    and knowledge base integrations (retrieval and ingestion).
  version: "1.0.0"
servers:
  - url: /api/v1
    description: Main API Gateway
paths:
  /users:
    post:
      summary: Create a new user
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List users
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /companies:
    get:
      summary: List target companies
      operationId: listCompanies
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'

  /roles:
    get:
      summary: List target roles
      operationId: listRoles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

  /topics:
    get:
      summary: List competency topics
      operationId: listTopics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic'

  /questions:
    get:
      summary: List and search questions
      operationId: listQuestions
      security:
        - BearerAuth: []
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
        - name: topicId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'

  /assessments:
    post:
      summary: Create a new assessment
      operationId: createAssessment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                type:
                  type: string
      responses:
        '201':
          description: Assessment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'

  /submissions:
    post:
      summary: Submit code for evaluation
      operationId: createSubmission
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '202':
          description: Submission accepted for execution
          headers:
            Idempotency-Key:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /evaluations:
    get:
      summary: Get evaluation results
      operationId: getEvaluations
      security:
        - BearerAuth: []
      parameters:
        - name: submissionId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'

  /mastery:
    get:
      summary: Get student mastery state
      operationId: getMastery
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mastery state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mastery'

  /interviews:
    post:
      summary: Start an interview session
      operationId: startInterview
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                mode:
                  type: string
                  enum: [text, audio]
      responses:
        '201':
          description: Interview session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSession'

  /roadmaps:
    post:
      summary: Generate a personalized learning roadmap
      operationId: generateRoadmap
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                targetCompanyId:
                  type: string
                targetRoleId:
                  type: string
      responses:
        '201':
          description: Roadmap generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roadmap'

  /retrieval:
    post:
      summary: Perform RAG retrieval
      operationId: searchKnowledge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                filters:
                  type: object
      responses:
        '200':
          description: Retrieval results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    chunkText:
                      type: string
                    provenance:
                      type: object

  /ingestion:
    post:
      summary: Trigger knowledge ingestion crawl
      operationId: startIngestion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seedUrl:
                  type: string
                companyId:
                  type: string
      responses:
        '202':
          description: Ingestion job created

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Role:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
    Topic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Question:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
    Assessment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
    SubmissionCreateRequest:
      type: object
      properties:
        assessmentId:
          type: string
        questionId:
          type: string
        code:
          type: string
        language:
          type: string
    Submission:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    Evaluation:
      type: object
      properties:
        id:
          type: string
        submissionId:
          type: string
        score:
          type: number
    Mastery:
      type: object
      properties:
        userId:
          type: string
        scores:
          type: object
    InterviewSession:
      type: object
      properties:
        id:
          type: string
        wsUrl:
          type: string
    Roadmap:
      type: object
      properties:
        id:
          type: string
        items:
          type: array
          items:
            type: object
