services:
  tools:
    image: python:3.11-slim
    profiles:
    - tools
    volumes:
    - .:/app
    working_dir: /app
    environment:
    - POSTGRES_DSN=${POSTGRES_DSN}
    - MONGO_URI=${MONGO_URI}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - MINIO_ENDPOINT=http://minio:9000
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    depends_on:
    - postgres
    - redis
    - minio
  postgres:
    image: postgres:18-alpine
    container_name: ai_mentor_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_mentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_mentor_db}
    ports:
    - 5432:5432
    volumes:
    - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-ai_mentor} -d ${POSTGRES_DB:-ai_mentor_db}
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ai_mentor_redis
    ports:
    - 6379:6379
  minio:
    image: quay.io/minio/minio:latest
    container_name: ai_mentor_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
    - 9000:9000
    - 9001:9001
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: ai_mentor_crawl4ai
    ports:
    - 11225:11225
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ai_mentor_api-gateway
    ports:
    - 8001:8000
    environment:
    - APP_NAME=api-gateway
    - POSTGRES_DSN=${POSTGRES_DSN}
    - MONGO_URI=${MONGO_URI}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - MINIO_ENDPOINT=http://minio:9000
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    depends_on:
    - redis
  identity:
    build:
      context: .
